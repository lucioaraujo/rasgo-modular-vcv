# Builds the .vcvplugin for Linux, Windows and macOS with the free VCV Rack
# SDK, and publishes a GitHub release when a tag v* is pushed.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  SDK: 2.6.6

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-$SDK-lin-x64.zip
          unzip -q sdk.zip -d "$HOME"
          make -j4 dist RACK_DIR="$HOME/Rack-SDK"
      - uses: actions/upload-artifact@v4
        with:
          name: lin-x64
          path: dist/*.vcvplugin

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make zip unzip mingw-w64-x86_64-gcc jq
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-$SDK-win-x64.zip
          unzip -q sdk.zip -d "$HOME"
          make -j4 dist RACK_DIR="$HOME/Rack-SDK"
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*.vcvplugin

  # Both slices on Apple Silicon runners; the SDK cross-compiles x64 with
  # clang --target (CROSS_COMPILE), as VCV's own toolchain does.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-apple-darwin
          - arch: arm64
            triple: arm64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-$SDK-mac-${{ matrix.arch }}.zip
          unzip -q sdk.zip -d "$HOME"
          make -j4 dist RACK_DIR="$HOME/Rack-SDK" CROSS_COMPILE=${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/*.vcvplugin \
            --title "Rasgo Modular for VCV Rack ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
